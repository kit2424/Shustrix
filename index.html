<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shustrix</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Unbounded:wght@300;400;700;900&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #b44fff;
    --purple-bright: #d580ff;
    --purple-dim: #5a1490;
    --pink: #ff4fd8;
    --dark: #000000;
    --surface: #0b080f;
    --border: rgba(180, 79, 255, 0.22);
    --glow: 0 0 35px rgba(180, 79, 255, 0.35);
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 10%, #2a0a4e 0%, transparent 55%),
      radial-gradient(ellipse at 80% 90%, #1a0535 0%, transparent 50%),
      #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Raleway', sans-serif;
    overflow-x: hidden;
    position: relative;
    padding: 20px;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(180,79,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,79,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridShift 20s linear infinite;
    z-index: 0;
  }
  @keyframes gridShift {
    from { background-position: 0 0; }
    to { background-position: 40px 40px; }
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .card {
    position: relative;
    width: min(560px, 95vw);
    background: linear-gradient(145deg, #0e0916 0%, #070510 50%, #0a0813 100%);
    border: 1px solid var(--border);
    overflow: hidden;
    animation: fadeUp 0.8s ease forwards;
    box-shadow:
      0 0 0 1px rgba(180,79,255,0.08),
      0 0 80px rgba(180,79,255,0.15),
      0 0 160px rgba(120,30,200,0.1),
      inset 0 0 80px rgba(0,0,0,0.6);
    z-index: 10;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    height: 3px;
    background: linear-gradient(90deg, transparent, #b44fff, #ff4fd8, #b44fff, transparent);
    position: relative;
  }
  .card-top::after {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 100%;
    background: linear-gradient(90deg, #b44fff, #ff4fd8);
    box-shadow: 0 0 20px 4px rgba(180,79,255,0.7);
    animation: barPulse 2.5s ease-in-out infinite;
  }
  @keyframes barPulse {
    0%, 100% { opacity: 1; width: 120px; }
    50% { opacity: 0.5; width: 180px; }
  }

  .card-inner { padding: 44px 40px 40px; }

  .corner {
    position: absolute;
    width: 16px; height: 16px;
    border-color: var(--purple);
    border-style: solid;
    opacity: 0.5;
  }
  .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    opacity: 0.18;
  }
  .orb1 { width: 200px; height: 200px; background: #8800ff; top: -60px; right: -40px; animation: orbFloat 6s ease-in-out infinite; }
  .orb2 { width: 150px; height: 150px; background: #ff00cc; bottom: -50px; left: -30px; animation: orbFloat 8s ease-in-out infinite reverse; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(10px, -15px); }
  }

  .header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }
  .avatar { width: 72px; height: 72px; position: relative; flex-shrink: 0; }
  .avatar-glow {
    position: absolute; inset: -8px;
    background: radial-gradient(ellipse, rgba(180,79,255,0.35), transparent 70%);
    animation: avatarPulse 3s ease-in-out infinite;
    border-radius: 50%;
  }
  @keyframes avatarPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.1); }
  }
  .channel-name {
    font-family: 'Unbounded', sans-serif;
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg, #ffffff 0%, #d580ff 50%, #ff4fd8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(180,79,255,0.4));
  }
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(180,79,255,0.4), rgba(255,79,216,0.3), transparent);
    margin: 0 0 26px;
  }
  .versions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border: 1px solid rgba(180,79,255,0.35);
    background: rgba(180,79,255,0.08);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--purple-bright);
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    cursor: default;
  }
  .badge-dot {
    width: 6px; height: 6px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    flex-shrink: 0;
    animation: blink 1.5s step-end infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 6px;
  }
  .link-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border: 1px solid rgba(180,79,255,0.18);
    background: rgba(255,255,255,0.02);
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .link-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, var(--purple), var(--pink));
    transform: scaleY(0);
    transition: transform 0.3s ease;
  }
  .link-item:hover { border-color: rgba(180,79,255,0.4); transform: translateX(4px); }
  .link-item:hover::before { transform: scaleY(1); }
  .link-icon {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(180,79,255,0.1);
    border: 1px solid rgba(180,79,255,0.2);
    flex-shrink: 0;
  }
  .link-icon svg { width: 18px; height: 18px; fill: var(--purple-bright); transition: fill 0.3s ease; }
  .link-item:hover .link-icon svg { fill: var(--pink); }
  .link-info { flex: 1; }
  .link-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: rgba(180,79,255,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .link-value {
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.9);
  }
  .link-arrow { font-size: 18px; color: rgba(180,79,255,0.4); transition: all 0.3s; }
  .link-item:hover .link-arrow { color: var(--purple-bright); transform: translateX(4px); }
  .footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid rgba(180,79,255,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: rgba(180,79,255,0.3);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: rgba(180,79,255,0.5);
  }
  .status-dot {
    width: 6px; height: 6px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border-radius: 50%;
    animation: blink 2s ease-in-out infinite;
  }
  .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.15; }
    100% { transform: translateY(-20px) translateX(20px); opacity: 0; }
  }
</style>
</head>

<script>
  const container = document.getElementById('particles');
  const colors = ['#b44fff', '#ff4fd8', '#d580ff', '#8800ff'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 14) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    const size = Math.random() > 0.6 ? '3px' : '2px';
    p.style.width = p.style.height = size;
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.background = color;
    p.style.boxShadow = `0 0 6px ${color}`;
    container.appendChild(p);
  }
</script>
